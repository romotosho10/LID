services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lid
      POSTGRES_PASSWORD: lid
      POSTGRES_DB: lid
    ports:
      - "5432:5432"
    volumes:
      - lid_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  lid_pg_data: